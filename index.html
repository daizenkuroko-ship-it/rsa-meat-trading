<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSA Meat Trading — Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <h1>RSA Meat Trading</h1>
    <p class="portal-subtitle">Wholesale Management Portal</p>

    <div class="alert-error" id="authError" style="display:none;">
      <strong>Authentication Failed</strong><br>
      The email or password you entered is incorrect. Please try again.
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username / Email</label>
        <input type="text" id="username" placeholder="admin@rsameat.com" required>
      </div>
      <div class="form-group">
        <label>Password <a href="#" class="forgot-link">Forgot password?</a></label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <label class="remember-me">
        <input type="checkbox"> Remember me on this device
      </label>
      <button type="submit" class="btn primary-btn">Sign in to Portal</button>
    </form>

    <p class="secure-note">Secure access restricted to authorized personnel only.</p>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
