<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — RSA Meat Trading</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">RSA Meat Trading</h2>
      <nav class="side-nav">
        <a href="dashboard.html" class="active">📊 Dashboard</a>
        <a href="orders.html">📦 Orders</a>
        <a href="customers.html">👤 Customers</a>
        <a href="#">📈 Reports</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="index.html" class="logout-link">↩ Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-header">
        <h1>Dashboard</h1>
        <div class="top-search">
          <input type="text" placeholder="Search orders...">
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><span class="stat-label">Total Orders</span><span class="stat-value" id="totalOrders">0</span></div>
        <div class="stat-card"><span class="stat-label">Pending</span><span class="stat-value" id="pendingCount">0</span></div>
        <div class="stat-card"><span class="stat-label">Preparing</span><span class="stat-value" id="preparingCount">0</span></div>
        <div class="stat-card"><span class="stat-label">Ready</span><span class="stat-value" id="readyCount">0</span></div>
        <div class="stat-card"><span class="stat-label">Completed</span><span class="stat-value" id="completedCount">0</span></div>
      </div>

      <div class="content-grid">
        <div class="card">
          <div class="card-header"><h3>Recent Orders</h3><a href="orders.html" class="view-all">View All →</a></div>
          <table class="data-table">
            <thead>
              <tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="recentOrdersBody">
              <tr><td colspan="6" style="text-align:center; color:#888; padding:1.5rem;">📭 No orders yet.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card">
          <h3>Order Breakdown</h3>
          <div class="big-number" id="bigTotal">0</div>
          <div class="breakdown-stats">
            <div><span class="dot completed"></span> Completed <strong id="compStat">0</strong></div>
            <div><span class="dot pending"></span> Pending <strong id="pendStat">0</strong></div>
            <div><span class="dot preparing"></span> Preparing <strong id="prepStat">0</strong></div>
            <div><span class="dot ready"></span> Ready <strong id="readyStat">0</strong></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
