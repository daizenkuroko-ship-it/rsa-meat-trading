<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Order — RSA Meat Trading</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">RSA Meat Trading</h2>
      <nav class="side-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="orders.html" class="active">📦 Orders</a>
        <a href="customers.html">👤 Customers</a>
        <a href="#">📈 Reports</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="orders.html" class="logout-link">↩ Back to Orders</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-header"><h1>Create New Order</h1></div>

      <form class="card order-form" id="orderForm">
        <div class="form-section">
          <h3>Customer Details</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Company Name *</label>
              <input type="text" id="company" required>
            </div>
            <div class="form-group">
              <label>Contact Person</label>
              <input type="text" id="contact">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
            <div class="form-group"><label>Email</label><input type="email" id="email"></div>
          </div>
          <div class="form-group">
            <label>Delivery Address *</label>
            <textarea id="address" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Order Date</label><input type="date" id="orderDate" required></div>
            <div class="form-group"><label>Delivery Date</label><input type="date" id="delivDate"></div>
            <div class="form-group"><label>Status</label>
              <select id="status">
                <option>Pending</option><option>Preparing</option><option>Ready</option><option>Completed</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>Order Items</h3>
          <table class="data-table">
            <thead><tr><th>Product</th><th>Qty (kg)</th><th>Price/kg ($)</th><th>Subtotal ($)</th><th></th></tr></thead>
            <tbody id="itemsBody">
              <tr class="item-row">
                <td><input type="text" class="prod-name" placeholder="e.g. Beef Ribeye" required></td>
                <td><input type="number" class="qty" step="0.01" min="0" required></td>
                <td><input type="number" class="price" step="0.01" min="0" required></td>
                <td class="row-subtotal">0.00</td>
                <td><button type="button" class="remove-btn">✕</button></td>
              </tr>
            </tbody>
          </table>
          <button type="button" class="btn secondary-btn" id="addRow">+ Add Item</button>
        </div>

        <div class="form-section summary">
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
          <div class="summary-row"><span>Tax (5%)</span><span id="tax">$0.00</span></div>
          <div class="summary-row grand-total"><span>Total</span><span id="grandTotal">$0.00</span></div>
        </div>

        <div class="form-actions">
          <button type="reset" class="btn cancel-btn" onclick="location.href='orders.html'">Cancel</button>
          <button type="submit" class="btn primary-btn">Save Order</button>
        </div>
      </form>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
